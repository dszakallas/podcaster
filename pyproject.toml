[project]
name = "podcaster"
version = "0.2.0"
description = "Podcaster automation tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.4.1",
    "mutagen>=1.47.0",
    "notebooklm-py[browser]==0.8.1",
    "playwright>=1.50.0",  # Required for browser-based automation and Playwright MCP server
    "jinja2",
    "pydantic",
    "pyyaml",
    "google-genai",
    "Pillow",
    "httpx",
    "google-cloud-speech",
    "google-cloud-storage",
    "rookiepy>=0.5.6",  # Required for browser cookie extraction for NotebookLM authentication
    "dbos>=2.31.0",
    "pytimeparse2>=1.7.0",
    "langcodes>=3.5.0",
    "aiostream>=0.6.4",
    "json-repair>=0.30.0",
]

[project.scripts]
podcaster = "podcaster.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C901", "PLR0912", "PLR0913", "PLR0915", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/podcaster/cli/*" = ["PLR0913"]
"src/podcaster/workflows/**/cli.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-statements = 60

[tool.pyright]
include = ["src/podcaster", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = ".devenv/profiles/agents/state"
venv = "venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/podcaster"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
