# DBOS workflow persistence configuration
dbos:
  engine: "sqlite"
  sqlite_path: "~/.podcaster/dbos.db"

# Configured LLM/agent tools used for executing sub-tasks
# The agent should have all necessary tools and skills installed to carry out
# a specific task effectively. Currently the only agentic task is web scraping
agents:
  # Reference name for an agent definition
  agy-gemini-flash:
    # Command prefix to invoke the agent
    command: "agy"
    # Arguments passed to the command. {{ prompt }} is replaced with the prompt.
    args:
      - "--model"
      - "Gemini 3.6 Flash (Low)"
      - "--dangerously-skip-permissions"
      - "-p"
      - "{{ prompt }}"
  claude-sonnet:
    command: "claude"
    args:
      - "--model"
      - "claude-sonnet-5"
      - "--dangerously-skip-permissions"
      - "-p"
      - "{{ prompt }}"
  opencode-bailin-qwen:
    command: opencode
    args:
      - run
      - --model
      - "bailian-payg/qwen3.6-flash"
      - "{{ prompt }}"

# Agentic scrapers used when extracting web page text/content
scrapers:
  default: # Reference name for this scraper configuration
    # The scraping tool/MCP server to run, will be included in the prompt
    tool: "chrome-devtools"
    # The agent used to control/instruct the scraper
    agent:
      # Reference to a defined agent from the 'agents' section above
      ref: agy-gemini-flash

# Configurations for generating podcasts using NotebookLM
podcast_generators:
  default: # Reference name for this generator configuration
    # Target languages for generation
    languages: ["en", "hu", "cs"]
    # Desired length bucket: "short" (<=12m), "default" (<=25m), "long" (>25m), or "auto" (inferred)
    length: "default"
  long-en:
    # Target languages for generation
    languages: ["en"]
    length: "long"

# ID3 tagging settings for the generated audio files
podcast_tags:
  default:
    # The album artist tag applied to the audio files
    album_artist: "John Doe"
    # The list of artists tags applied to the audio files
    artists: ["NotebookLM"]

# Configurations for the transcription of generated podcast audio
podcast_transcribers:
  # Reference name for this transcriber configuration
  default:
    # Audio speed factor applied during transcription preprocessing (speeds up audio for faster transcribing)
    speed_factor: 1.5
    # Languages configured for transcription tasks
    languages: ["cs", "en"]

# Workflow configurations for managing deep dive podcast generation pipelines
workflow:
  # Working directory root, workfow files will be saved into a unique subdirectory keyed by the workflow id; defaults to the current directory.
  workdir: "."
  presets:
    # Reference name of the workflow preset
    deep-dive-default:
      # The workflow type (currently only "deep_dive_article" is supported)
      type: "deep_dive_article"
      # Reference to an importer configuration under 'importers'
      importer:
        ref: "default"
      podcast_generator:
        # Reference to a key under 'podcast_generators'
        ref: "default"
      # Web research & source enrichment options
      enrich_web:
        enable: true
        retry_count: 0
        spec:
          # Mode of enrichment: "fast" or "deep"
          mode: "fast"
          # Reference to an importer or inline importer config for failed research imports
          fallback_importer:
            ref: "scraper"
          # Optional maximum allowed import failures during research (default: null tolerates any failure count)
          # max_import_failures: 2
      # Podcast album cover art generation options
      generate_cover:
        enable: true
        retry_count: 0
        spec:
          # Gemini model used for album cover image generation (default: gemini-3.1-flash-image)
          model: "gemini-3.1-flash-image"
      # Audio transcription & LRC subtitle generation options
      transcribe:
        enable: true
        retry_count: 0
        # Transcriber settings (refers to a key under 'podcast_transcribers' or specified inline)
        podcast_transcriber:
          # Reference to a key under 'podcast_transcribers'
          ref: "default"
      # ID3 tagging options
      tagging:
        enable: true
        spec:
          ref: "default"
      # Distribution targets for deploying completed podcasts. note: they run concurrently
      distribute:
        # Deploy using Rsync/Rclone target
        - ref: gdrive-backup

# Importers definition
importers:
  default:
    chain:
      importers:
        - ref: native
        - ref: scraper
  native:
    match:
      - ".*"
      - "!https?://.*wsj\\.com/.*"
      - "!https?://.*forbes\\.com/.*"
      - "!https?://.*politico\\.(eu|com)/.*"
      - "!https?://.*nytimes\\.com/.*"
      - "!https?://.*hvg\\.hu/.*"
      - "!https?://.*msn\\.com/.*"
      - "!https?://.*archive\\.(ph|is)/.*"
    native: {}
  scraper:
    match:
      - "https?://.*"
      - "!file:.*"
      - "!gdrive:.*"
    scraper:
      ref: default

# Top-level notification target definitions (plex, discord)
notifiers:
  my-plex:
    plex:
      # Section ID of the target library in Plex
      section_id: 14
      # Library directory path on the Plex server
      server_library_path: "/mnt/podcasts"
      # Base URL of the Plex server
      server_url: "http://localhost:32400"
      # Plex authentication token
      # Sensitive field, better to use the PLEX_TOKEN or the NOTIFIERS_MY_PLEX_PLEX_TOKEN environment variable
      token: "your-plex-token"
  my-discord:
    discord:
      # Sensitive field, better to use the DISCORD_WEBHOOK_URL or the NOTIFIERS_MY_DISCORD_DISCORD_WEBHOOK_URL environment variable
      webhook_url: "https://discord.com/api/webhooks/your-webhook-id/your-webhook-token"

# Distribution target definitions (rsync, rclone)
distributions:
  gdrive-backup:
    rsync: # rsync handles both RSync/Rclone
      method: "rclone"
      destination: "gdrive:podcasts"
      flags: []
    notifiers:
      - ref: my-plex
      - ref: my-discord


# Google Cloud Platform configuration (required for cover generation and transcription)
gcp:
  # GCP project ID
  project_id: "your-gcp-project"
  # GCP region/location for resource allocation
  location: "us-central1"
  # GCS bucket name used for staging files during transcription
  gcs_bucket: "your-bucket"
