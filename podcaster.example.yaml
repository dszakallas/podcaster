podcast_dir: "podcasts"
agents:
  # agents are currently needed only for scraping
  agy-gemini-flash:
    command: "agy"
    args:
      - "--model"
      - "Gemini 3.5 Flash (Low)"
      - "--dangerously-skip-permissions"
      - "-p"
      - "{{ prompt }}"
  claude:
    command: "claude"
    args:
      - "--model"
      - "claude-sonnet-4-6"
      - "--dangerously-skip-permissions"
      - "-p"
      - "{{ prompt }}"

scraper:
  tool: "chrome-devtools"  # name of the mcp server to use for scraping
  agent:
    ref: agy-gemini-flash  # reference to an agent configuration from above

podcast_generators:
  default:
    languages: ["en", "hu"]
    length: "default"  # short, default, long, or auto (inferred from article)

podcast_tags:
  album_artist: "Your Name"
  artists: ["Your Name"]

podcast_transcription:
  speed_factor: 1.5

workflow:
  deep-dive-default:
    type: "deep_dive_article"
    podcast_generator:
      ref: "default"
    enrich_web:
      enable: true
      retry_count: 0
      spec:
        max_imports: 5
        mode: "fast"
        ignore_errors: false
    generate_cover:
      enable: true
      retry_count: 0
      spec: {}
    transcribe:
      enable: true
      retry_count: 0
      spec:
        languages: ["cs", "en"]
    distribute:
      - type: plex
        ref: my-media-server  # reference to a plex configuration
      - type: rsync
        ref: gdrive-backup  # reference to a rsync configuration

rsync:
  main-server:
    method: "rsync"
    destination: "user@host:/mnt/podcasts"
  gdrive-backup:
    method: "rclone"  # rclone supported for uploading to cloud storage
    destination: "gdrive:podcasts"

plex:
  my-media-server:
    rsync:
      enabled: true  # we can do rsync as part of plex sync
      ref: main-server 
    section_id: 14
    server_library_path: "/mnt/podcasts"
    server_url: "http://localhost:32400"
    token: "your-plex-token"

gcp:
  project_id: "your-gcp-project"
  location: "us-central1"
  gcs_bucket: "your-bucket"

research:
  unimportables:  # sites blocked in NotebookLM, needs fallback import method
    - "example\\.com"
    - "another-example\\.com"
  import_fallback: "scrape"
